<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password – Raji Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#09090b;--mfg:#71717a;--border:#e4e4e7;--ring:#a1a1aa;--primary:#18181b;--pfg:#fafafa;--brand:#4f46e5;--brand2:#7c3aed;--bad:#dc2626;--bad-soft:#fee2e2;--ok:#16a34a;--warn:#d97706;--muted:#f4f4f5}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--fg:#fafafa;--mfg:#a1a1aa;--border:#27272a;--ring:#52525b;--primary:#fafafa;--pfg:#18181b;--brand:#818cf8;--brand2:#a78bfa;--bad:#f87171;--bad-soft:#2d0a0a;--ok:#4ade80;--warn:#fbbf24;--muted:#18181b}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px;
 background-image:radial-gradient(700px 300px at 50% -80px,color-mix(in srgb,var(--brand) 18%,transparent),transparent)}
.card{width:min(420px,100%);border:1px solid var(--border);border-radius:14px;padding:32px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.05),0 20px 50px rgba(0,0,0,.08)}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;margin-bottom:18px}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}.sub{color:var(--mfg);margin:0 0 6px}
label{display:block;font-size:13px;font-weight:500;margin:16px 0 6px}
input{width:100%;height:40px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:0 12px;color:inherit;font:inherit;outline:none}
input:focus{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}
.meter{display:flex;gap:4px;margin-top:10px}.meter i{flex:1;height:4px;border-radius:9px;background:var(--border);transition:.2s}
.hint{font-size:12px;color:var(--mfg);margin-top:6px}
.btn{width:100%;height:40px;margin-top:22px;border:0;border-radius:8px;background:var(--primary);color:var(--pfg);font:inherit;font-weight:500;cursor:pointer}
.btn:hover{opacity:.9}.btn:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:500}
</style></head><body>
<form class="card" id="f">
  <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <h1>Set a new password</h1><p class="sub">Google verification passed. Choose a strong password.</p>
  <label for="a">New password</label><input id="a" type="password" autocomplete="new-password" required autofocus>
  <div class="meter"><i></i><i></i><i></i><i></i><i></i></div><div class="hint" id="h">At least 12 characters, with letters and a number or symbol.</div>
  <label for="c">Confirm password</label><input id="c" type="password" autocomplete="new-password" required>
  <div class="err" id="e"></div>
  <button class="btn" id="b">Save and sign in</button>
</form>
<script>
const $=id=>document.getElementById(id);
function score(p){let s=0;if(p.length>=12)s++;if(p.length>=16)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s}
$('a').oninput=()=>{const s=score($('a').value);const col=s<3?'var(--bad)':s<4?'var(--warn)':'var(--ok)';[...document.querySelectorAll('.meter i')].forEach((el,i)=>el.style.background=i<s?col:'var(--border)');$('h').textContent=s<3?'Weak — add length, mixed case, numbers or symbols.':s<4?'Okay — a bit longer would be better.':'Strong password.'};
function show(t){const e=$('e');e.textContent=t;e.style.display=t?'block':'none'}
$('f').onsubmit=async ev=>{
  ev.preventDefault();show('');
  if($('a').value!==$('c').value)return show('Passwords do not match.');
  $('b').disabled=true;$('b').textContent='Saving…';
  try{
    const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('a').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){location.href='/';return}
    show(j.detail||'Could not reset the password.');
    if(r.status===401)setTimeout(()=>location.href='/forgot?err='+encodeURIComponent('Verification expired. Please verify with Google again.'),1800);
  }catch(e){show('Network error. Try again.')}
  $('b').disabled=false;$('b').textContent='Save and sign in';
};
</script></body></html>
